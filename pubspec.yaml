name: flipperguard
description: Passive BLE monitor to protect against Flipper BLE spam
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.35.0
  permission_handler: ^11.3.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  share_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true